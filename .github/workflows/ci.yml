name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  FOUNDRY_VERSION: "v1.3.5"
  SHELLCHECK_VERSION: "v0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  # ml/.venv + TrustMark weights are cached under one key, written by `ml`, read by `e2e-local`.
  # Bump to invalidate. The rest of the key (python version, requirements and fetch-weights hashes)
  # is spelled out in both jobs and must stay identical.
  ML_CACHE_VERSION: "ml-v1"

jobs:
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [ts]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @stamper/explorer exec playwright install --with-deps chromium
      - name: Playwright smoke against fixtures (next build + start, fixture server)
        run: pnpm --filter @stamper/explorer test:e2e

